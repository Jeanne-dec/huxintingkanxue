<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>舟人与船体图层预览器 · V4.1</title><link rel="stylesheet" href="./layer-preview.css"><body><main><header><p>第二幕 V4.1 · 真实素材接入准备</p><h1>舟人与船体图层预览器</h1><p id="status" class="blocked">BLOCKED_ART：尚未提供精确透明美术素材。本工具只加载、合成并验证真实图层。</p></header><section class="layout"><aside><h2>人物关键帧选择</h2><div id="controls"></div><h2>1672 × 941 RGBA 图层</h2><p>每项必须与权威母版同一原点。公开演示包未包含尚未终验的正式 Alpha 素材，可用文件选择器手工载入本机 PNG。</p><div id="inputs"></div><button id="autoload">尝试加载标准目录</button><button id="clear">清空已加载图层</button></aside><section class="stage"><canvas id="canvas" width="1672" height="941" aria-label="图层叠加预览"></canvas><p id="layers">未加载透明层。</p></section></section><section class="report"><h2>完整舟体保护区逐像素差异报告</h2><p>记录一个人物组合为基线，改变任一人物后比较。船体保护 Alpha 中、三张人物 Alpha 外的变化必须为 0。</p><div><button id="baseline">记录基线</button><button id="compare">与基线比较</button></div><pre id="result">等待精确素材。当前状态为 BLOCKED_ART。</pre></section></main><script type="module" src="./layer-preview.js"></script></body></html>
